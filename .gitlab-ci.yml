spec:
  inputs:
    build_project:
      description: 'Whether or not to build the project.'
      default: true
      type: boolean
    create_ort_sbom:
      description: 'Whether or not to create a sbom with OSS.'
      default: true
      type: boolean
    ort_debug_level:
      description: 'The debug level of the ORT of the sbom-crate job.'
      options:
        - '--debug'
        - '--info'
      default: '--info'
    ort_package_manager:
      description: 'The package Manager to use for ORT analyse step of the sbom-crate job.'
      options: [ 'Gradle', 'GradleInspector' ]
      # Note: Using 'Gradle' with the current configuration results in the following error:
      # Gradle failed to resolve dependencies for path 'app/build.gradle.kts':
      # BuildException: Could not fetch model of type 'OrtDependencyTreeModel' using connection to Gradle distribution
      #'https://services.gradle.org/distributions/gradle-9.5.1-bin.zip'. Caused by: LocationAwareException:
      # Initialization script '/tmp/ort-Gradle2784232720922775632/init14110782986763283682.gradle' line: 215
      # Caused by: BuildActionExecutionException: null Caused by: ConcurrentModificationException: null
      default: 'GradleInspector'
      type: string
    create_gradle_sbom:
      description: 'Whether or not to create a sbom with Gradle buildscript plugin.'
      default: true
      type: boolean
    upload_sbom:
      description: 'Whether or not to upload the sbom result to the artifactory.'
      default: true
      type: boolean
    publish_snapshot_automatically:
      description: 'Whether or not to publish the snapshot automatically. If set to false the upload will be a manual action.'
      default: false
      type: boolean

---

include:
  - local: '.gitlab-ci/ort-scan.yml'
# needed for sbom-vun
#  - local: '/gitlab-ci/gitlab-sbom-preprod.yml'

stages:
  - check
  - build
  - oss-sbom
  - publish

.gradle-cache:
  cache:
    key:
      files:
        - gradle/wrapper/gradle-wrapper.properties
        - gradle/libs.versions.toml
    paths:
      - .gradle/caches/
      - .gradle/wrapper/

variables:
  ANDROID_BUILD_IMAGE: partner.bdr.de/sektidp-docker-final/sekt-idp-android-pipeline-build-image:0.3.2
  GRADLE_USER_HOME: $CI_PROJECT_DIR/.gradle
  # JAVA_OPTS are used for 'gradlew' and within the gradle build script for Android unit tests
  JAVA_OPTS: '-Dhttps.proxyHost=$PROXY_HOST -Dhttp.proxyHost=$PROXY_HOST -Dhttps.proxyPort=$PROXY_PORT -Dhttp.proxyPort=$PROXY_PORT -Dhttp.nonProxyHosts=$NON_PROXY_HOSTS'
  ARTIFACTORY_URL: https://partner.bdr.de/artifactory/sektidp-maven-final/
  ARTIFACTORY_SNAPSHOT_URL: https://partner.bdr.de/artifactory/sektidp-maven-staging/
  ARTIFACTORY_SBOM_URL: https://partner.bdr.de/artifactory/sektidp-generic-final/
  ARTIFACTORY_SBOM_SNAPSHOT_URL: https://partner.bdr.de/artifactory/sektidp-generic-staging/
  ARTIFACTORY_USER: $GL_TECH_USER_NAME
  ARTIFACTORY_TOKEN: $GL_ART_ID_TOKEN
  ARTIFACTORY_APIKEY: $GL_ART_ID_TOKEN
  # The NOT base64 encoded content of the Basic Authorization header, aka "username:password".
  # This value is used to access the 'gitlab.partner.bdr.de' to fetch the dependencies.
  GL_TECH_BASIC_AUTH: "${GL_TECH_USER_NAME}:${GL_TECH_TOKEN}"
  ### sbom variables
  # The relative path to the sbom results. This folder will be compressed and uploaded to the artifactory.
  SBOM_PATH_TO_RESULT_RELATIVE: sbom
  # The absolute path to folder the ORT sbom result should be directed to.
  OSS_PATH_TO_RESULT: $CI_PROJECT_DIR/$SBOM_PATH_TO_RESULT_RELATIVE/oss_result
  # Specifies the output directory of the gradle ':sdk:generateLicenseReport' task. The path should be absolute.
  GRADLE_LICENSE_REPORT_OUT: $CI_PROJECT_DIR/$SBOM_PATH_TO_RESULT_RELATIVE/gradle_result
  # The directory the gradle 'sdk:publishReleasePublicationToProjectMavenRepository' task will publish the artifacts.
  # Note: The directory is hardcoded within the build script. If the path should be changed the build script needs
  # to be adapted.
  PROJECT_MAVEN_DIR_NAME: .m2-project

default:
  image: $ANDROID_BUILD_IMAGE

check-variables:
  image:
    name: partner.bdr.de/docker-remote/ubuntu:26.04
  stage: check
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" &&
        $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^(main|development)$/
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_COMMIT_TAG
      when: manual
  script:
    - |
      check_var=
      if [ -z "$DOCKER_AUTH_CONFIG" ]; then echo "Docker Authentication not set! How to set Docker Authentication -> https://partner.bdr.de/confluence/display/BOP/How+to+authorized+access+Artifactory+from+GitLab+pipeline"; check_var=100; else echo "Docker Authentication OK"; fi
      if [ -z "$GL_TECH_USER_NAME" ]; then echo "Artifactory-User not set! Look up -> https://partner.bdr.de/confluence/pages/viewpage.action?pageId=91805664"; check_var=100; else echo "Artifactory-User OK"; fi
      if [ -z "$GL_ART_ID_TOKEN" ]; then echo "Artifactory identity token not set! How to retrieve Artifactory identity token -> https://partner.bdr.de/confluence/x/fQAXG"; check_var=100; else echo "Artifactory identity token OK"; fi
      if [ -z "$PROXY_HOST" ]; then echo "HTTP proxy host not set! Needed for gradle build script"; check_var=100; else echo "HTTP proxy host OK"; fi
      if [ -z "$PROXY_PORT" ]; then echo "HTTP proxy port not set! Needed for gradle build script"; check_var=100; else echo "HTTP proxy port OK"; fi
      if [ -z "$NON_PROXY_HOSTS" ]; then echo "HTTP non proxy hosts not set! Needed for gradle build script"; check_var=100; else echo "HTTP non proxy hosts OK"; fi
      if [ ! -z "$check_var" ]; then echo "Variable not set. Check error message"; exit 1; fi

# Make Project
build:
  stage: build
  needs:
    - check-variables
  cache:
    - !reference [ .gradle-cache, cache ]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" &&
        $CI_MERGE_REQUEST_DRAFT == "false" &&
        $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^(main|development)$/
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" &&
        $CI_MERGE_REQUEST_DRAFT == "true" &&
        $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^(main|development)$/
      when: manual
    - if: $CI_PIPELINE_SOURCE == "web" && "$[[ inputs.build_project ]]" == "true"
  script:
    - chmod +x ./gradlew
    - ./gradlew --full-stacktrace --no-daemon :sdk:publishReleasePublicationToProjectMavenRepository
  artifacts:
    name: "build_output"
    paths:
      - .m2-project/
    expire_in: 1 day

# Note: Does not work as intended, produces a 75MB "scan-result.json" file with millions of error entries.
sbom-ort-create:
  extends: .ort-scan
  stage: oss-sbom
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" &&
        $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^(main|development)$/
      allow_failure: true
      when: manual
    - if: $CI_COMMIT_TAG
      allow_failure: true
    - if: $CI_PIPELINE_SOURCE == "web" && "$[[ inputs.create_ort_sbom ]]" == "true"
      allow_failure: true
  variables:
    SW_NAME: $CI_PROJECT_NAME
    SW_VERSION: $CI_COMMIT_SHA
    # The folder to scan, otherwise "CI_PROJECT_DIR" will be scanned.
    PROJECT_SCAN_PATH: $CI_PROJECT_DIR
    # The path to the maven settings file, if necessary.
    #ORT_MAVEN_SETTINGS_FILE: $CI_PROJECT_DIR/.gitlab-ci/ort-maven-settings.xml
    # Add a package Manager to use for analyze step
    # For gradle build. Sometimes it is useful to use Gradle not Gradle Inspector
    PACKAGE_MANAGER: "$[[ inputs.ort_package_manager ]]"
    # Set debug level by project
    # Normal setting i "info", for debug issues set to "--debug"
    ORT_DEBUG_LEVEL: "$[[ inputs.ort_debug_level ]]"
    # user for gitlab access
    ORT_HTTP_USERNAME: $GL_TECH_USER_NAME
    # token for gitlab access
    ORT_HTTP_PASSWORD: $GL_TECH_TOKEN
    # NOTE: OSS_PATH_TO_RESULT is defined globally
  before_script:
    #- git config --global url."https://${GL_TECH_BASIC_AUTH}@gitlab.partner.bdr.de/".insteadOf "https://gitlab.partner.bdr.de/"
    # Use HTTPS instead of SSH for Git cloning
    - git config --global url.https://github.com/.insteadOf ssh://git@github.com/
    # Change ownership of node_modules to the user that runs the ort script (the USER in the Dockerfile)
    - if [ -d node_modules ]; then sudo chown -R ort:ort node_modules; fi
  artifacts:
    when: always
    name: "sbom_oss_result"
    paths:
      - ${OSS_PATH_TO_RESULT}/

sbom-gradle-create:
  stage: oss-sbom
  cache:
    - !reference [ .gradle-cache, cache ]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" &&
        $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^(main|development)$/
      allow_failure: true
      when: manual
    - if: $CI_COMMIT_TAG
      allow_failure: false
    - if: $CI_PIPELINE_SOURCE == "web" && "$[[ inputs.create_gradle_sbom ]]" == "true"
      allow_failure: false
  script:
    - chmod +x ./gradlew
    - ./gradlew --full-stacktrace --no-daemon :sdk:generateLicenseReport
  artifacts:
    when: always
    name: "sbom_gradle_result"
    paths:
      - ${GRADLE_LICENSE_REPORT_OUT}/

sbom-upload:
  image: partner.bdr.de/docker-remote/ubuntu:26.04
  stage: oss-sbom
  needs:
    - job: sbom-ort-create
      optional: true
    - job: sbom-gradle-create
      optional: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" &&
        $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^(main|development)$/
      allow_failure: true
    - if: $CI_COMMIT_TAG
      allow_failure: false
    - if: $CI_PIPELINE_SOURCE == "web" &&
        "$[[ inputs.upload_sbom ]]" == "true" &&
        ("$[[ inputs.create_ort_sbom ]]" == "true" || "$[[ inputs.create_gradle_sbom ]]" == "true")
      allow_failure: false
  variables:
    SBOM_MODULE_NAME: egk-nfc-communicator
    SBOM_ZIP: sbom-${SBOM_MODULE_NAME}-${CI_COMMIT_SHORT_SHA}.tar.gz
  script:
    - |
      if [ ! -d "$SBOM_PATH_TO_RESULT_RELATIVE" ] || [ -z "$(ls -A "$SBOM_PATH_TO_RESULT_RELATIVE" 2>/dev/null)" ]; then
        echo "sbom result missing, '$SBOM_PATH_TO_RESULT_RELATIVE' is either missing or empty."
        exit 1
      fi
    - apt-get -yq update && apt-get install -yq curl
    - tar -zcvf "$SBOM_ZIP" "$SBOM_PATH_TO_RESULT_RELATIVE"
    - |
      if [ -z "$CI_COMMIT_TAG" ]; then
        BASE_ARTIFACTORY=$ARTIFACTORY_SBOM_SNAPSHOT_URL
      else
        BASE_ARTIFACTORY=$ARTIFACTORY_SBOM_URL
      fi
    - mkdir .tmp
    - CURL_RESULT_FILE=.tmp/curl_result
    - SBOM_TIME=$(date -u +"%Y-%m-%dT%H-%M-%S")
    - CURL_HTTP_CODE=$(curl -s -w "%{http_code}" -o "$CURL_RESULT_FILE" -u "${ARTIFACTORY_USER}:${ARTIFACTORY_TOKEN}" -T ./$SBOM_ZIP ${BASE_ARTIFACTORY}sbom/de/bdr/sektidp/${SBOM_MODULE_NAME}/${SBOM_TIME}_${CI_COMMIT_SHA}/)
    - |
      if [ "$CURL_HTTP_CODE" -ge 400 ]; then echo "Uploading sbom failed with HTTP: $CURL_HTTP_CODE"; cat "$CURL_RESULT_FILE"; exit 1; fi
  artifacts:
    paths:
      - $SBOM_ZIP

publish-release:
  stage: publish
  cache:
    - !reference [ .gradle-cache, cache ]
  needs:
    - job: sbom-upload
  rules:
    - if: $CI_COMMIT_TAG
      when: manual
  script:
    - chmod +x ./gradlew
    - ./gradlew --full-stacktrace --no-daemon :sdk:publishReleasePublicationToArtifactoryReleaseRepository

publish-snapshot:
  stage: publish
  cache:
    - !reference [ .gradle-cache, cache ]
  rules:
    - if: $CI_PIPELINE_SOURCE == "web" && "$[[ inputs.publish_snapshot_automatically ]]" == "true"
    - if: $CI_PIPELINE_SOURCE == "web" && "$[[ inputs.publish_snapshot_automatically ]]" == "false"
      when: manual
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
      allow_failure: true
  script:
    - chmod +x ./gradlew
    - ./gradlew --full-stacktrace --no-daemon :sdk:publishSnapshotPublicationToArtifactorySnapshotRepository