.ort-scan:
  image:
    name: partner.bdr.de/innersrc-docker-final/sbom-stuff/bdr-ort-config:87.1.0-23872084
    entrypoint: [ "" ]
  cache:
    key: ${CI_PROJECT_NAME}_OSS
    paths:
      - cache/.m2/repository
      - cache/.go/pkg/mod
      - cache/pip
      - cache/.pip
      - cache/.gradle
      - cache/yarn
      - cache/node_modules
      - cache/ivy2/cache
      - cache/sbt
      - node_modules/
  variables:
    ORT_DATA_DIR: /home/ort/.ort
    ORT_CONFIG_DIR: ${ORT_DATA_DIR}/config
    # GRADLE_USER_HOME: $CI_PROJECT_DIR/.gradle
    MAVEN_REPO_LOCAL: "${CI_PROJECT_DIR}/cache/.m2/repository"
    GO_CACHE_LOCAL: "${CI_PROJECT_DIR}/cache/.go/pkg/mod"
    PIP_CACHE_DIR: "${CI_PROJECT_DIR}/cache/pip"
    GRADLE_USER_HOME: "${CI_PROJECT_DIR}/cache/.gradle"
    YARN_CACHE_FOLDER: "${CI_PROJECT_DIR}/cache/yarn"
    NODE_PATH: "${CI_PROJECT_DIR}/cache/node_modules"
    SBT_OPTS: "-Dsbt.global.base=${CI_PROJECT_DIR}/cache/sbt -Dsbt.ivy.home=${CI_PROJECT_DIR}/cache/ivy2 -Divy.home=${CI_PROJECT_DIR}/cache/ivy2"
    # proxy configuration for docker
    BUILD_ARGS: >
      --build-arg no_proxy=$no_proxy
      --build-arg http_proxy=$http_proxy
      --build-arg https_proxy=$https_proxy
    # proxy configuration for gradle
    GRADLE_OPTS_PROXY: >
      -Dhttps.proxyHost=${https_proxy}
      -Dhttps.proxyPort=${https_proxy}
      -Dhttps.nonProxyHosts=${no_proxy}
      -Dhttp.proxyHost=${http_proxy}
      -Dhttp.proxyPort=${http_proxy}
      -Dhttp.nonProxyHosts=${no_proxy}
    MAVEN_OPTS: >
      -Dhttp.proxyHost=$PROXY_HOST
      -Dhttp.proxyPort=$PROXY_PORT
      -Dhttps.proxyHost=$PROXY_HOST
      -Dhttps.proxyPort=$PROXY_PORT
      -Dhttp.nonProxyHosts=$NON_PROXY_HOSTS
      -Dhttps.protocols=TLSv1.2
      -Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository
      -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=WARN
      -Dorg.slf4j.simpleLogger.showDateTime=true
      -Djava.awt.headless=true
    JAVA_TOOL_OPTIONS: >
      -Dgradle.wrapperUser=$GRADLE_WRAPPER_USER
      -Dgradle.wrapperPassword=$GRADLE_WRAPPER_PASSWORD
      -Dhttp.proxyHost=$PROXY_HOST
      -Dhttp.proxyPort=$PROXY_PORT
      -Dhttps.proxyHost=$PROXY_HOST
      -Dhttps.proxyPort=$PROXY_PORT
      -Dhttp.nonProxyHosts=$NON_PROXY_HOSTS
      -DARTIFACTORY_USER=$ARTIFACTORY_USER
      -DARTIFACTORY_PASSWORD=$ARTIFACTORY_APIKEY
  script:
    # Workaround for maven cache.
    - |
      if [[ -d "$MAVEN_REPO_LOCAL" ]]; then
        mkdir -p ${HOME}/.m2/repository/
        mv ${MAVEN_REPO_LOCAL}/* ${HOME}/.m2/repository/
      fi

    # Workaround for go cache.
    - |
      if [[ -d "$GO_CACHE_LOCAL" ]]; then
        mkdir -p ${GOPATH}/pkg/mod
        mv ${GO_CACHE_LOCAL}/* ${GOPATH}/pkg/mod/
      fi

    - |
      if [[ $PROJECT_SCAN_PATH != "" ]]; then
          echo "PROJECT_SCAN_PATH is set"
        else 
          echo "No PROJECT_SCAN_PATH"
          export PROJECT_SCAN_PATH="${CI_PROJECT_DIR}"
      fi

    - |
      if [[ $PACKAGE_MANAGER != "" ]]; then
          echo "PACKAGE_MANAGER is set ${PACKAGE_MANAGER} " 
          export ANALYZE_ARGS="-P ort.analyzer.enabledPackageManagers=${PACKAGE_MANAGER}"
          echo "PACKAGE_MANAGER is set ${PACKAGE_MANAGER} " 
        else 
          echo "No PACKAGE_MANAGER"
      fi

    - |
      if [ -f "${ORT_MAVEN_SETTINGS_FILE}" ]; then
        mkdir -p ${HOME}/.m2/ && cp ${ORT_MAVEN_SETTINGS_FILE} ${HOME}/.m2/settings.xml
      fi


    - echo -e "\e[1;33m PROJECT_SCAN_PATH is ${PROJECT_SCAN_PATH}"

    - export ORT_CLI="/opt/ort/bin/ort"
    - export OSS_PATH_TO_RESULT_ORT=${OSS_PATH_TO_RESULT}/ort
    - export ORT_RESULTS_NOTICE_DEFAULT_PATH="${OSS_PATH_TO_RESULT_ORT}/reporter/NOTICE_DEFAULT"
    - export ORT_RESULTS_THIRD_PARTY_LIC_INFO="${OSS_PATH_TO_RESULT_ORT}/reporter/Third_Party_License_Information.txt"

    - echo -e "\e[1;33m Version of ORT ... "
    - ${ORT_CLI} --version
    - |
      echo -e "\e[1;33m  ORT analyze ... "
      ${ORT_CLI} ${ANALYZE_ARGS} ${ORT_DEBUG_LEVEL} analyze -f JSON -i ${PROJECT_SCAN_PATH} -o ${OSS_PATH_TO_RESULT_ORT}/analyze  \
        || ORT_CLI_ANALYZE_EXIT_CODE=$? \
        && export ORT_CLI_ANALYZE_EXIT_CODE="${ORT_CLI_ANALYZE_EXIT_CODE:-0}"
      [[ ${ORT_CLI_ANALYZE_EXIT_CODE} -eq 1 ]] && exit 1

    - |
      echo -e "\e[1;33m  ORT scan ... "
      ${ORT_CLI} ${ORT_DEBUG_LEVEL} scan -f JSON -i ${OSS_PATH_TO_RESULT_ORT}/analyze/analyzer-result.json -o ${OSS_PATH_TO_RESULT_ORT}/scan \
        || ORT_CLI_SCANNER_EXIT_CODE=$? \
        && export ORT_CLI_SCANNER_EXIT_CODE="${ORT_CLI_SCANNER_EXIT_CODE:-0}"
      [[ ${ORT_CLI_SCANNER_EXIT_CODE} -eq 1 ]]  && exit 1

    #- |
    #  echo -e "\e[1;33m  ORT advise ... "
    #  ${ORT_CLI} advise -i ${OSS_PATH_TO_RESULT_ORT}/scan/scan-result.json -f JSON -o ${OSS_PATH_TO_RESULT_ORT}/advise --advisors OSV \
    #    || ORT_CLI_AADVISE_EXIT_CODE=$? \
    #    && export ORT_CLI_ADVISE_EXIT_CODE="${ORT_CLI_ADVISE_EXIT_CODE:-0}"
    #  [[ ${ORT_CLI_ADVISE_EXIT_CODE} -eq 1 ]] && exit 1


    - |
      echo -e "\e[1;33m  ORT evaluate ... "
      ${ORT_CLI} ${ORT_DEBUG_LEVEL} evaluate -f JSON -i${OSS_PATH_TO_RESULT_ORT}/scan/scan-result.json -o ${OSS_PATH_TO_RESULT_ORT}/evaluate \
          || ORT_CLI_EVALUATE_EXIT_CODE=$? \
          && export ORT_CLI_EVALUATE_EXIT_CODE="${ORT_CLI_EVALUATE_EXIT_CODE:-0}" 
        [[ ${ORT_CLI_EVALUATE_EXIT_CODE} -eq 1 ]]  && exit 1

    - |
      echo -e "\e[1;33m  ORT report ... "
      ${ORT_CLI} ${ORT_DEBUG_LEVEL} report -f SpdxDocument,CycloneDX,WebApp,PlainTextTemplate,StaticHtml -O PlainTextTemplate=template.id=NOTICE_DEFAULT,NOTICE_SUMMARY -i ${OSS_PATH_TO_RESULT_ORT}/evaluate/evaluation-result.json -o ${OSS_PATH_TO_RESULT_ORT}/reporter \
        || ORT_CLI_REPORTER_EXIT_CODE=$? \
        && export ORT_CLI_REPORTER_EXIT_CODE="${ORT_CLI_REPORTER_EXIT_CODE:-0}"
      [[ ${ORT_CLI_REPORTER_EXIT_CODE} -eq 1 ]]  && exit 1

      #rename NOTICE_default file as workaround
    - |
      [[ -f ${ORT_RESULTS_NOTICE_DEFAULT_PATH} ]] \
        && mv $ORT_RESULTS_NOTICE_DEFAULT_PATH  $ORT_RESULTS_THIRD_PARTY_LIC_INFO

    - echo echo -e "\e[1;33m  ORT analyze result ${ORT_CLI_ANALYZE_EXIT_CODE}"
    - echo echo -e "\e[1;33m  ORT scan result ${ORT_CLI_SCANNER_EXIT_CODE}"
    - echo echo -e "\e[1;33m  ORT evaluate result ${ORT_CLI_EVALUATE_EXIT_CODE}"
    - echo echo -e "\e[1;33m  ORT reporter result ${ORT_CLI_REPORTER_EXIT_CODE}"
    - export ORT_SCAN_FINISHED_AT=$(date +"%Y-%m-%dT%H:%M:%S%z")
  allow_failure: true
  timeout: 20 hours
  tags:
    - docker


